<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>iw3 - 2D to 3D converter</title>
<style>
  /* One static page, no framework, nothing fetched from the network: this is a
     LAN service and it has to come up when the LAN is all there is. Everything
     below is plain CSS against the markup this file writes itself. */
  :root {
    --bg: #101216; --panel: #191c22; --raised: #21252e; --border: #2b3039;
    --text: #e6e8ed; --muted: #949aa8; --faint: #6b7280;
    --accent: #5b94ff; --accent-dim: #24304d;
    --ok: #46d19a; --err: #ff6b6b; --warn: #e3ae4a;
    --r: 10px; --r-sm: 6px;
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.22);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg); color: var(--text); margin: 0;
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-variant-numeric: tabular-nums;
  }
  a { color: var(--accent); }

  header {
    padding: var(--s4) var(--s5); border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; gap: var(--s3); flex-wrap: wrap;
    background: var(--panel);
  }
  header h1 { font-size: 19px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
  header .sub { color: var(--muted); font-size: 13px; }

  main {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
    gap: var(--s5); padding: var(--s5); max-width: 1500px; margin: 0 auto;
    align-items: start;
  }
  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--r); padding: var(--s4) var(--s4) var(--s5);
    box-shadow: var(--shadow);
  }
  .panel > h2 {
    font-size: 12px; margin: 0 0 var(--s4); color: var(--muted);
    text-transform: uppercase; letter-spacing: .08em; font-weight: 650;
    display: flex; align-items: baseline; gap: var(--s2); flex-wrap: wrap;
  }
  .full { grid-column: 1 / -1; }

  /* --- forms ------------------------------------------------------------ */
  label { display: block; margin: var(--s4) 0 var(--s1); color: var(--muted); font-size: 12px;
          text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
  input[type=number], input[type=text], select {
    width: 100%; background: #0c0e13; border: 1px solid var(--border);
    color: var(--text); padding: 9px 10px; border-radius: var(--r-sm);
    font: inherit; font-size: 14px;
  }
  input:focus-visible, select:focus-visible, button:focus-visible, .level:focus-within {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .row { display: flex; gap: var(--s3); }
  .row > * { flex: 1; }
  .checkbox-row { display: flex; align-items: center; gap: var(--s2); margin: var(--s3) 0; }
  .checkbox-row input { width: auto; }
  .checkbox-row label { margin: 0; text-transform: none; letter-spacing: 0;
                        font-size: 14px; font-weight: 400; color: var(--text); }
  .help { color: var(--muted); font-size: 12.5px; line-height: 1.5; margin-top: var(--s1); }
  .help strong { color: var(--text); font-weight: 600; }

  button {
    background: var(--accent); color: #fff; border: 1px solid transparent;
    padding: 9px 16px; border-radius: var(--r-sm); cursor: pointer;
    font: inherit; font-size: 14px; font-weight: 550; min-height: 38px;
  }
  button:hover:not(:disabled) { filter: brightness(1.12); }
  button.secondary { background: var(--raised); border-color: var(--border); color: var(--text); }
  button.danger { background: transparent; border-color: #5b3030; color: var(--err); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .actions { display: flex; gap: var(--s3); flex-wrap: wrap; }

  /* --- file browser ----------------------------------------------------- */
  #browser { max-height: 300px; overflow-y: auto; border: 1px solid var(--border);
             border-radius: var(--r-sm); background: #0c0e13; }
  .entry { padding: 8px 10px; cursor: pointer; display: flex; gap: var(--s2);
           align-items: center; border-bottom: 1px solid #1a1d24; font-size: 14px; }
  .entry:last-child { border-bottom: 0; }
  .entry:hover { background: var(--raised); }
  .entry.selected { background: var(--accent-dim); }
  .entry .icon { width: 18px; opacity: .8; flex: none; }
  #selectedPath { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                  font-size: 13px; color: var(--accent); word-break: break-all;
                  margin-top: var(--s3); min-height: 1.4em; }

  /* --- quality level cards ---------------------------------------------- */
  /* A level is picked by what it costs and what it gives up, so both are on
     the card. The disadvantages are set in the same size and weight as the
     advantages: a level whose drawbacks are in smaller type is being sold. */
  /* The levels sit side by side, not stacked. Four detailed cards in a column
     push the rest of the form off the screen; in a row the whole choice is
     visible at once and no drawback has to be hidden to achieve it. Narrow
     windows drop to fewer columns on their own. */
  #qualityLevels {
    display: grid; gap: var(--s2);
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    align-items: stretch;
  }
  .level {
    display: block; position: relative; border: 1px solid var(--border);
    border-radius: var(--r); padding: var(--s3); margin: 0;
    cursor: pointer; background: var(--raised); transition: border-color .12s, background .12s;
  }
  .level::before {
    content: ""; position: absolute; left: -1px; top: 12px; bottom: 12px; width: 3px;
    border-radius: 3px; background: transparent;
  }
  .level:hover:not(.disabled) { border-color: #3b4252; }
  .level.checked { border-color: var(--accent); background: #1b2230; }
  .level.checked::before { background: var(--accent); }
  .level.disabled { opacity: .55; cursor: not-allowed; }
  .level-head { display: flex; align-items: baseline; gap: var(--s2); flex-wrap: wrap; }
  .level-head input { width: auto; margin: 0; flex: none; accent-color: var(--accent); }
  .level-head .name { font-weight: 650; font-size: 15.5px; }
  .level-head .time {
    margin-left: auto; color: var(--accent); white-space: nowrap; font-weight: 600;
  }
  .level.checked .level-head .time { color: #8fb4ff; }
  .level-head .time.unknown { color: var(--faint); font-weight: 400; }
  .level .uses { margin-top: var(--s2); color: var(--text); font-size: 13.5px; }
  .level .for { margin-top: var(--s1); color: var(--muted); font-size: 13px; }
  .ledger { margin: var(--s3) 0 0; padding: 0; list-style: none; font-size: 13px; }
  .ledger li { display: flex; gap: var(--s2); margin-top: var(--s1); line-height: 1.5; }
  .ledger .mark { flex: none; width: 1em; font-weight: 700; }
  .ledger .pro .mark { color: var(--ok); }
  .ledger .con .mark { color: var(--err); }
  .ledger li span:last-child { color: var(--muted); }
  .level.checked .ledger li span:last-child { color: #c6cad4; }
  .level .blocked { margin-top: var(--s2); color: var(--warn); font-size: 13px; }

  .option {
    border: 1px solid var(--border); border-radius: var(--r-sm);
    padding: var(--s3) var(--s4); margin-bottom: var(--s2); background: var(--raised);
  }
  .option-head { display: flex; align-items: baseline; gap: var(--s2); }
  .option-head input { width: auto; margin: 0; flex: none; accent-color: var(--accent); }
  .option-head label { margin: 0; text-transform: none; letter-spacing: 0;
                       font-size: 14px; font-weight: 600; color: var(--text); }
  .option-head .time { margin-left: auto; color: var(--muted); white-space: nowrap; }
  .option.off { opacity: .45; }
  #estimateBasis { margin-top: var(--s3); padding-top: var(--s3);
                   border-top: 1px solid var(--border); }

  /* --- notices ---------------------------------------------------------- */
  .banner { margin: 0 var(--s5) calc(-1 * var(--s2)); padding: 11px 15px; border-radius: var(--r);
            background: #332913; border: 1px solid var(--warn); color: #f2ddb2;
            font-size: 13.5px; line-height: 1.5; }
  .banner + .banner { margin-top: var(--s3); }

  /* --- job table -------------------------------------------------------- */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); font-size: 13.5px; }
  th { color: var(--muted); font-weight: 600; font-size: 11px;
       text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
  tbody tr:hover td { background: #1d212a; }
  .status { padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 650;
            white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .status-queued { background: #262a33; color: var(--muted); }
  .status-running { background: var(--accent-dim); color: #8fb4ff; }
  .status-running::before { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
  .status-done { background: #14382a; color: var(--ok); }
  .status-failed { background: #3a1d1d; color: var(--err); }
  .status-canceled { background: #262a33; color: var(--faint); }
  .job-actions { white-space: nowrap; }
  .job-actions button { padding: 4px 9px; font-size: 12px; min-height: 30px; }
  /* Queue order is edited in place, so the rows have to look draggable before
     anyone tries it: a grip, a grab cursor, and a gap where the row will land. */
  tr.queued-row { cursor: grab; }
  tr.queued-row.dragging { opacity: .4; cursor: grabbing; }
  tr.queued-row.dragging td { background: var(--accent-dim); }
  td.pos { white-space: nowrap; color: var(--muted); width: 1%; user-select: none; }
  td.pos .grip { color: #4b515e; margin-right: 6px; letter-spacing: -1px; }
  tr.queued-row:hover td.pos .grip { color: var(--accent); }
  td.pos .next { color: var(--accent); font-weight: 650; }
  .move button { padding: 3px 7px; font-size: 12px; min-height: 30px; }
  .bar { position: relative; height: 7px; background: #0c0e13; border: 1px solid var(--border);
         border-radius: 4px; overflow: hidden; min-width: 130px; }
  .bar > span { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
  /* The scene-detection pre-pass reports no total, so there is no honest
     percentage to draw - show motion instead of a made-up width. */
  .bar.indeterminate > span { width: 35%; animation: slide 1.4s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(320%); } }
  .progress-meta { color: var(--muted); font-size: 11.5px; margin-top: 4px; }
  td.eta { white-space: nowrap; }
  td.eta .approx { color: var(--muted); }
  td.path { max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #queueSummary { color: var(--muted); font-size: 12px; text-transform: none;
                  letter-spacing: 0; font-weight: 400; }
  #queueHint { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 400; }
  #log { background: #07090c; border: 1px solid var(--border); border-radius: var(--r-sm);
         padding: var(--s3); height: 320px; overflow: auto; margin-top: var(--s4);
         font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
         white-space: pre-wrap; display: none; }

  /* --- phone ------------------------------------------------------------ */
  /* The table becomes one card per job. No JS involved, so the queue logic
     above cannot break on a narrow screen - only its presentation changes. */
  @media (max-width: 860px) {
    main { padding: var(--s3); gap: var(--s3); grid-template-columns: 1fr; }
    header { padding: var(--s3) var(--s4); }
    .banner { margin: 0 var(--s3); }
    .panel { padding: var(--s3); }
    thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    table, tbody, tr, td { display: block; width: 100%; }
    tr { border: 1px solid var(--border); border-radius: var(--r-sm);
         margin-bottom: var(--s3); padding: var(--s2) 0; background: var(--raised); }
    td { border-bottom: 0; padding: 4px var(--s3); display: flex; gap: var(--s3);
         align-items: baseline; }
    td::before { content: attr(data-label); color: var(--muted); font-size: 11px;
                 text-transform: uppercase; letter-spacing: .06em; flex: none;
                 width: 84px; }
    td:empty { display: none; }
    td.path { max-width: none; white-space: normal; word-break: break-all; }
    .job-actions { flex-wrap: wrap; white-space: normal; }
    #queueHint { display: none; }   /* dragging is a mouse gesture; the buttons stay */
  }
</style>
</head>
<body>
<header>
  <h1>iw3</h1>
  <span class="sub">2D &rarr; stereo-3D batch converter<span id="deviceLabel"></span></span>
</header>
<div id="deviceBanner" class="banner" hidden></div>
<main>
  <div class="panel">
    <h2>1 &middot; Source</h2>
    <div id="browser"></div>
    <div id="selectedPath">No file or folder selected.</div>
    <div class="checkbox-row">
      <input type="checkbox" id="recursive">
      <label for="recursive">Process a whole folder, recursively</label>
    </div>
  </div>

  <div class="panel">
    <h2>2 &middot; Quality level</h2>
    <div id="qualityLevels"></div>
    <div id="qualityOptions"></div>
    <div id="estimateBasis" class="help"></div>
    <label for="stereoFormat">Stereo format</label>
    <select id="stereoFormat"></select>
    <div id="settingsForm"></div>
  </div>

  <div class="panel full">
    <h2>3 &middot; Run it</h2>
    <div class="actions">
      <button id="btnConvert">Convert the whole file</button>
      <button id="btnPreview" class="secondary">Preview one minute</button>
    </div>
    <label for="windowMode">Which minute to preview</label>
    <div class="row">
      <select id="windowMode">
        <option value="auto">Pick it automatically</option>
        <option value="manual">Start at a time I choose</option>
      </select>
      <input type="text" id="windowStart" placeholder="mm:ss or seconds" hidden>
    </div>
    <div id="windowHelp" class="help"></div>
  </div>

  <div class="panel full" id="comparePanel" hidden>
    <h2>Compare two previews in one file</h2>
    <div class="help" id="compareIntro"></div>
    <div class="row" style="margin-top:var(--s3);flex-wrap:wrap">
      <div><label for="cmpA">A</label><select id="cmpA"></select></div>
      <div><label for="cmpB">B</label><select id="cmpB"></select></div>
      <div><label for="cmpLayout">Arrangement</label><select id="cmpLayout"></select></div>
    </div>
    <div id="compareHelp" class="help"></div>
    <div class="actions" style="margin-top:var(--s4)">
      <button id="btnCompare" class="secondary">Build the comparison</button>
    </div>
  </div>

  <div class="panel full">
    <h2>Job queue <span id="queueSummary"></span>
      <span id="queueHint" class="help">drag a waiting row to reorder &middot; &#10514; run next &middot; &#10515; run last</span></h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th title="Drag a waiting row to reorder it">#</th><th>Created</th><th>Mode</th><th>Quality</th><th>Input</th><th>Format</th><th>Status</th><th>Progress</th><th>ETA</th><th></th></tr></thead>
        <tbody id="jobRows"></tbody>
      </table>
    </div>
    <div id="log"></div>
  </div>
</main>

<script>
const API = "/api";
let schema = null;
let currentBrowsePath = "";
let selected = null; // {path, type}

async function api(path, opts) {
  const res = await fetch(API + path, opts);
  if (!res.ok) { const t = await res.text(); throw new Error(t); }
  return res.status === 204 ? null : res.json();
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"]/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

// --- Device ------------------------------------------------------------
let health = null;
async function loadHealth() {
  try { health = await api("/health"); } catch (e) { return; }
  const label = document.getElementById("deviceLabel");
  const dev = health.device === "cpu" ? "CPU" : health.device.toUpperCase();
  const count = (health.accelerators?.[health.device]?.devices) || 0;
  label.textContent = ` · ${dev}${count > 1 ? ` ×${count}` : ""} · torch ${health.torch}`;
  if (health.warning) {
    const banner = document.getElementById("deviceBanner");
    banner.textContent = "Running on the CPU. " + health.warning;
    banner.hidden = false;
  }
}

// --- File browser -----------------------------------------------------
async function loadBrowser(path) {
  currentBrowsePath = path;
  const data = await api("/browse?path=" + encodeURIComponent(path));
  const el = document.getElementById("browser");
  el.innerHTML = "";
  if (data.path) {
    const up = document.createElement("div");
    up.className = "entry";
    up.innerHTML = `<span class="icon">↰</span> ..`;
    up.onclick = () => loadBrowser(data.path.split("/").slice(0, -1).join("/"));
    el.appendChild(up);
  }
  for (const entry of data.entries) {
    const row = document.createElement("div");
    row.className = "entry";
    row.innerHTML = `<span class="icon">${entry.type === "dir" ? "📁" : "🎬"}</span> ${esc(entry.name)}`;
    row.onclick = (e) => {
      if (entry.type === "dir" && e.detail === 2) { loadBrowser(entry.path); return; }
      document.querySelectorAll(".entry.selected").forEach(x => x.classList.remove("selected"));
      row.classList.add("selected");
      selected = entry;
      document.getElementById("selectedPath").textContent = "/input/" + entry.path
        + (entry.type === "dir" ? "  (double-click to open, single-click selects the folder itself)" : "");
      // The quality levels quote a time for *this* file, so they have to be
      // recomputed the moment the file changes.
      if (quality) refreshEstimates();
    };
    el.appendChild(row);
  }
}

// --- Quality levels -----------------------------------------------------
// The levels are measured recipes; the switches are extra stages. What the UI
// has to get right is the price tag: the measurements were taken on one
// 12-minute file, so the server recomputes every figure for the frame count of
// the selected source and the page shows which file it is quoting.
let quality = null;          // /api/quality
let currentLevel = "custom";

function selectedOptions() {
  return {
    flow: document.getElementById("opt_flow")?.checked || false,
    upscale: document.getElementById("opt_upscale")?.checked || false,
  };
}

function ledger(pros, cons) {
  const line = (cls, mark, text) =>
    `<li class="${cls}"><span class="mark">${mark}</span><span>${esc(text)}</span></li>`;
  return `<ul class="ledger">`
    + (pros || []).map(t => line("pro", "+", t)).join("")
    + (cons || []).map(t => line("con", "−", t)).join("")
    + `</ul>`;
}

function renderQuality() {
  currentLevel = quality.default;
  const box = document.getElementById("qualityLevels");
  box.innerHTML = "";
  for (const lv of quality.levels) {
    const el = document.createElement("label");
    el.className = "level" + (lv.available ? "" : " disabled");
    el.dataset.id = lv.id;
    el.innerHTML = `
      <span class="level-head">
        <input type="radio" name="quality" value="${lv.id}"
               ${lv.id === currentLevel ? "checked" : ""}
               ${lv.available ? "" : "disabled"}>
        <span class="name">${esc(lv.label)}</span>
        <span class="time" id="t_${lv.id}">—</span>
      </span>
      ${lv.available ? "" : `<div class="blocked">${esc(lv.unavailable_reason)}</div>`}
      <div class="uses">${esc(lv.uses || "")}</div>
      ${lv.good_for ? `<div class="for">Good for: ${esc(lv.good_for)}</div>` : ""}
      ${ledger(lv.pros, lv.cons)}`;
    el.querySelector("input").onchange = () => { currentLevel = lv.id; applyLevel(); };
    box.appendChild(el);
  }

  const opts = document.getElementById("qualityOptions");
  opts.innerHTML = quality.options.map(op => `
    <div class="option" id="row_${op.id}">
      <div class="option-head">
        <input type="checkbox" id="opt_${op.id}">
        <label for="opt_${op.id}">${esc(op.label)}</label>
        <span class="time" id="t_opt_${op.id}">—</span>
      </div>
      <div class="uses">${esc(op.uses || "")}</div>
      ${ledger(op.pros, op.cons)}
    </div>`).join("");
  for (const op of quality.options) {
    document.getElementById(`opt_${op.id}`).onchange = refreshEstimates;
  }
  document.getElementById("windowHelp").innerHTML =
    `<strong>Automatic:</strong> ${esc(quality.preview.window_rule)}<br>`
    + `Either way the pipeline runs ${quality.preview.lead_frames} frames before the `
    + `window and ${quality.preview.tail_frames} after it, and both are cut away again. `
    + `That is not padding: the convergence estimator carries a moving average across `
    + `frames, so a window started cold is not the same recipe as the full run.`;

  const layouts = document.getElementById("cmpLayout");
  layouts.innerHTML = quality.compare_layouts
    .map(l => `<option value="${l.id}">${esc(l.label)}</option>`).join("");
  applyLevel();
}

function applyLevel() {
  const lv = quality.levels.find(l => l.id === currentLevel) || {};
  for (const el of document.querySelectorAll(".level")) {
    el.classList.toggle("checked", el.dataset.id === currentLevel);
  }
  // The twelve iw3 settings belong to the level that is defined by them.
  // Under a named level they would look editable and be ignored.
  document.getElementById("settingsForm").hidden = !lv.settings_form;
  for (const op of quality.options) {
    const row = document.getElementById(`row_${op.id}`);
    const usable = !op.chain_only || lv.chain;
    row.classList.toggle("off", !usable);
    const box = document.getElementById(`opt_${op.id}`);
    box.disabled = !usable;
    if (!usable) box.checked = false;
  }
  refreshEstimates();
}

async function refreshEstimates() {
  const o = selectedOptions();
  const path = (selected && selected.type === "file") ? selected.path : "";
  const q = new URLSearchParams({ path, flow: o.flow, upscale: o.upscale });
  const qp = new URLSearchParams({ path, mode: "preview", flow: o.flow, upscale: o.upscale });
  let est, pre;
  try {
    [est, pre] = await Promise.all([api("/estimate?" + q), api("/estimate?" + qp)]);
  } catch (e) { return; }

  for (const lv of quality.levels) {
    const cell = document.getElementById(`t_${lv.id}`);
    const v = est.levels[lv.id], p = pre.levels[lv.id];
    if (!v || v.seconds === null) {
      cell.textContent = "not modelled";
      cell.className = "time unknown";
    } else {
      const mark = v.extrapolated ? "≈ " : "~ ";
      cell.textContent = mark + fmtDuration(v.seconds)
        + (p && p.seconds !== null ? ` · preview ${fmtDuration(p.seconds)}` : "");
      cell.className = "time";
      cell.title = (v.extrapolated
        ? "Extrapolated from HD measurements by this machine's own HD:4K rate ratio - no level has been measured on a 4K source. "
        : "") + (lv.notes || "");
    }
  }
  for (const op of quality.options) {
    const cell = document.getElementById(`t_opt_${op.id}`);
    cell.textContent = "+ " + fmtDuration(est.options[op.id].seconds);
    cell.title = op.notes || "";
  }
  const w = pre.preview_window;
  document.getElementById("estimateBasis").innerHTML =
    `Times for <strong>${est.frames.toLocaleString()} frames</strong> (${esc(est.basis)}`
    + `${est.resolution_bucket === "4k" ? ", 4K &ndash; extrapolated" : ""}). `
    + (w ? `A preview covers ${w.visible.toLocaleString()} visible frames plus `
         + `${w.lead} of lead and ${w.tail} of tail &mdash; `
         + `<strong>${pre.frames.toLocaleString()} of ${pre.source_frames.toLocaleString()} `
         + `frames, ${pre.preview_share}%</strong> of the file.` : "");
}

// --- Preview window -----------------------------------------------------
function parseTime(text) {
  const t = (text || "").trim();
  if (!t) return null;
  const parts = t.split(":").map(Number);
  if (parts.some(isNaN)) return NaN;
  return parts.reduce((acc, p) => acc * 60 + p, 0);
}

document.getElementById("windowMode").onchange = (e) => {
  document.getElementById("windowStart").hidden = e.target.value !== "manual";
};

// --- Settings form ------------------------------------------------------
function renderSettingsForm() {
  const sel = document.getElementById("stereoFormat");
  sel.innerHTML = schema.stereo_formats.map(f => `<option value="${f.value}">${esc(f.label)}</option>`).join("");

  const container = document.getElementById("settingsForm");
  container.innerHTML = "";
  for (const f of schema.fields) {
    const wrap = document.createElement("div");
    if (f.kind === "bool") {
      wrap.className = "checkbox-row";
      wrap.innerHTML = `<input type="checkbox" id="f_${f.dest}" ${f.default ? "checked" : ""}>
        <label for="f_${f.dest}">${esc(f.label)}</label>`;
    } else if (f.kind === "select") {
      wrap.innerHTML = `<label for="f_${f.dest}">${esc(f.label)}</label>
        <select id="f_${f.dest}">${(f.choices || []).map(c =>
          `<option value="${c ?? ''}" ${c === f.default ? "selected" : ""}>${c ?? '(auto)'}</option>`).join("")}</select>`;
    } else if (f.kind === "int_pair") {
      const d = f.default || [0, 0];
      wrap.innerHTML = `<label>${esc(f.label)}</label>
        <div class="row">
          <input type="number" id="f_${f.dest}_x" value="${d[0]}">
          <input type="number" id="f_${f.dest}_y" value="${d[1]}">
        </div>`;
    } else {
      wrap.innerHTML = `<label for="f_${f.dest}">${esc(f.label)}</label>
        <input type="number" id="f_${f.dest}" value="${f.default ?? 0}"
          min="${f.min ?? ''}" max="${f.max ?? ''}" step="${f.step ?? 1}">`;
    }
    if (f.help) wrap.innerHTML += `<div class="help">${esc(f.help)}</div>`;
    container.appendChild(wrap);
  }
}

function collectParams() {
  const params = {};
  for (const f of schema.fields) {
    if (f.kind === "bool") params[f.dest] = document.getElementById(`f_${f.dest}`).checked;
    else if (f.kind === "select") {
      const v = document.getElementById(`f_${f.dest}`).value;
      params[f.dest] = v === "" ? null : v;
    } else if (f.kind === "int_pair") {
      params[f.dest] = [
        parseInt(document.getElementById(`f_${f.dest}_x`).value, 10),
        parseInt(document.getElementById(`f_${f.dest}_y`).value, 10),
      ];
    } else {
      params[f.dest] = parseFloat(document.getElementById(`f_${f.dest}`).value);
    }
  }
  return params;
}

// --- Job submission -------------------------------------------------
async function submitJob(mode) {
  if (!selected) { alert("Select a file or folder first."); return; }
  const lv = quality.levels.find(l => l.id === currentLevel) || {};
  const o = selectedOptions();
  let startSec = null;
  if (mode === "preview" && document.getElementById("windowMode").value === "manual") {
    startSec = parseTime(document.getElementById("windowStart").value);
    if (startSec === null || isNaN(startSec)) {
      alert("Give the start of the preview window as seconds or mm:ss.");
      return;
    }
  }
  const body = {
    mode,
    input_path: selected.path,
    recursive: document.getElementById("recursive").checked,
    stereo_format: document.getElementById("stereoFormat").value,
    quality: currentLevel,
    flow: o.flow,
    upscale: o.upscale,
    preview_start_sec: startSec,
    // A named level carries its own parameters; sending the form alongside
    // would only invite the question of which one won.
    params: lv.settings_form ? collectParams() : {},
  };
  try {
    await api("/jobs", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  } catch (e) {
    // api() throws the server's body; a rejected job used to fail silently.
    alert("Could not queue the job:\n\n" + e.message);
    return;
  }
  refreshJobs();
}
document.getElementById("btnConvert").onclick = () => submitJob("convert");
document.getElementById("btnPreview").onclick = () => submitJob("preview");

// --- Comparing two previews --------------------------------------------
// Offered only when there are two to compare, because an empty pair of
// dropdowns is a question the page cannot answer.
let comparable = [];

function describePreview(p) {
  const bits = [p.quality_label];
  if (p.flow) bits.push("+flow");
  if (p.upscale) bits.push("+4K");
  const at = p.preview_start_sec === null ? "auto window"
           : `from ${fmtDuration(p.preview_start_sec)}`;
  return `${bits.join(" ")} · ${p.input_path.split("/").pop()} · ${at}`;
}

async function refreshComparable() {
  let next;
  try { next = await api("/comparable"); } catch (e) { return; }
  const changed = JSON.stringify(next.map(p => p.id)) !== JSON.stringify(comparable.map(p => p.id));
  comparable = next;
  const panel = document.getElementById("comparePanel");
  panel.hidden = comparable.length < 2;
  if (panel.hidden || !changed) return;
  for (const [id, pick] of [["cmpA", 0], ["cmpB", 1]]) {
    const sel = document.getElementById(id);
    const keep = sel.value;
    sel.innerHTML = comparable.map(p =>
      `<option value="${p.id}">${esc(describePreview(p))}</option>`).join("");
    sel.value = comparable.some(p => p.id === keep) ? keep : (comparable[pick]?.id || "");
  }
  document.getElementById("compareIntro").innerHTML =
    "Both previews are already side-by-side stereo, so they are interleaved "
    + "<strong>per eye</strong>: the left eye gets A's left eye and B's left eye, the "
    + "right eye gets both right eyes. Laying two stereo frames next to each other "
    + "instead would hand the headset one recipe per eye.";
  document.getElementById("compareHelp").innerHTML =
    "<strong>A / B / A</strong> keeps the geometry exactly as it is and shows the same "
    + "window three times. It is how every recipe question was actually settled: seeing "
    + "the change twice, and in both directions, finds differences that sitting side by "
    + "side does not.<br>"
    + "<strong>A above B</strong> puts both in view at once, 1920×2160 per eye. Vertical "
    + "rather than horizontal so each keeps a full 1920×1080 picture &ndash; but each eye "
    + "is then 16:18, and a player that assumes 16:9 per eye will stretch it.";
}

document.getElementById("btnCompare").onclick = async () => {
  const body = {
    a: document.getElementById("cmpA").value,
    b: document.getElementById("cmpB").value,
    layout: document.getElementById("cmpLayout").value,
  };
  try {
    const r = await api("/compare", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (!r.same_source) {
      alert("Queued - but those two previews are of different source files, so the "
            + "comparison shows two films rather than two recipes.");
    }
  } catch (e) {
    alert("Could not build the comparison:\n\n" + e.message);
    return;
  }
  refreshJobs();
};

// --- Job queue table --------------------------------------------------
let openLogJobId = null;
let logEventSource = null;

// tqdm hands us seconds; show them the way a person reads a wait.
function fmtDuration(sec) {
  if (sec === null || sec === undefined) return "—";
  sec = Math.round(sec);
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  if (h) return `${h}h ${String(m).padStart(2, "0")}m`;
  if (m) return `${m}m ${String(s).padStart(2, "0")}s`;
  return `${s}s`;
}

const STATUS_WORD = { queued: "waiting", running: "running", done: "done",
                      failed: "failed", canceled: "canceled" };

// The level a job ran at, plus its switches. Jobs from before the levels
// existed carry 'custom', which is what they were.
function qualityCell(j) {
  if (j.mode === "compare") {
    let p = {};
    try { p = JSON.parse(j.params_json); } catch (e) {}
    return esc(p.layout === "stacked" ? "stacked" : "A/B/A");
  }
  const lv = quality?.levels.find(l => l.id === j.quality);
  const bits = [];
  if (j.opt_flow) bits.push("flow");
  if (j.opt_upscale) bits.push("4K");
  return esc(lv ? lv.label : (j.quality || "custom"))
    + (bits.length ? ` <span class="help" style="display:inline">+${bits.join(" +")}</span>` : "");
}

function progressCell(j) {
  if (j.status === "done") {
    return `<div class="bar"><span style="width:100%;background:var(--ok)"></span></div>`;
  }
  if (j.status !== "running") return "";
  const p = j.progress;
  if (!p) {
    return `<div class="bar indeterminate"><span></span></div>
            <div class="progress-meta">starting…</div>`;
  }
  // Choosing and cutting the preview window happens before iw3 starts, so
  // there is no tqdm bar to show yet - only a statement of what it is busy with.
  if (p.phase === "extract" || p.phase === "scan") {
    return `<div class="bar indeterminate"><span></span></div>
            <div class="progress-meta">${p.phase === "scan"
              ? "choosing the preview window…" : "cutting the preview clip…"}</div>`;
  }
  // A pipeline job is five or six programs of wildly different lengths, so
  // there is no honest single percentage for the job. What there is: which
  // stage it is in, and how far that stage has got.
  if (p.phase === "chain") {
    const bar = p.percent === null
      ? `<div class="bar indeterminate"><span></span></div>`
      : `<div class="bar"><span style="width:${p.percent}%"></span></div>`;
    const parts = [`stage ${p.stage}/${p.stages}`, esc(p.stage_label)];
    if (p.percent !== null) parts.push(`${p.percent}% of the stage`);
    if (p.rate_fps) parts.push(`${p.rate_fps} fps`);
    return `${bar}<div class="progress-meta">${parts.join(" · ")}</div>`;
  }
  // The scene-detection pre-pass draws its own bar. Show it, but never let it
  // read as conversion progress - it runs at ~700 fps and finishes in seconds.
  const scene = p.phase === "scene_detect";
  const bar = p.percent === null
    ? `<div class="bar indeterminate"><span></span></div>`
    : `<div class="bar"><span style="width:${p.percent}%${scene ? ';background:var(--muted)' : ''}"></span></div>`;
  const parts = [];
  if (scene) parts.push("scene detection");
  if (p.percent !== null) parts.push(`${p.percent}%`);
  if (p.total_frames) parts.push(`${p.frames.toLocaleString()}/${p.total_frames.toLocaleString()}`);
  else parts.push(`${p.frames.toLocaleString()} frames`);
  parts.push(`${p.rate_fps} fps`);
  return `${bar}<div class="progress-meta">${parts.join(" · ")}</div>`;
}

function etaCell(j) {
  if (j.eta_sec === null || j.eta_sec === undefined) return "—";
  const text = fmtDuration(j.eta_sec);
  // Mark anything derived from measured throughput rather than from tqdm, so
  // a real countdown is never confused with a projection.
  return j.eta_estimated
    ? `<span class="approx" title="Estimated from measured throughput, not yet reported by iw3">~${text}</span>`
    : text;
}

async function refreshQueueSummary() {
  const el = document.getElementById("queueSummary");
  try {
    const q = await api("/queue-eta");
    if (!q.jobs) { el.textContent = ""; return; }
    let text = `· ${q.jobs} active`;
    if (q.total_sec !== null) {
      text += ` · ${q.exact ? "" : "~"}${fmtDuration(q.total_sec)} remaining`;
    }
    if (q.jobs_counted < q.jobs) {
      text += ` (${q.jobs - q.jobs_counted} not estimable)`;
    }
    el.textContent = text;
  } catch (e) {
    el.textContent = "";
  }
}

// --- Queue reordering ---------------------------------------------------
// Native HTML5 drag and drop, no library: the row follows the pointer, and the
// server is told the resulting order once, on drop.
const drag = { id: null, dropped: false };

function queuedRows() {
  return [...document.querySelectorAll("#jobRows tr.queued-row")];
}

// The queued row the dragged one should land in front of, or null for "past
// the last one". Only queued rows count as landing places, which is what keeps
// a row from being dropped above the running job or down among the history.
function dropAnchor(y) {
  for (const row of queuedRows()) {
    if (row.classList.contains("dragging")) continue;
    const box = row.getBoundingClientRect();
    if (y < box.top + box.height / 2) return row;
  }
  return null;
}

async function commitOrder() {
  const order = queuedRows().map(r => r.dataset.id);
  try {
    await api("/queue/reorder", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ order }),
    });
  } catch (e) {
    alert("Could not save the new queue order:\n\n" + e.message);
  }
  await refreshJobs();
}

async function moveJob(id, to) {
  try {
    await api(`/jobs/${id}/move`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ to }),
    });
  } catch (e) {
    alert("Could not move the job:\n\n" + e.message);
  }
  await refreshJobs();
}

function initQueueDnd() {
  const tbody = document.getElementById("jobRows");
  tbody.addEventListener("dragover", (e) => {
    if (!drag.id) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    const dragged = tbody.querySelector("tr.dragging");
    if (!dragged) return;
    const anchor = dropAnchor(e.clientY);
    if (anchor) { tbody.insertBefore(dragged, anchor); return; }
    const firstHistory = tbody.querySelector("tr.history-row");
    if (firstHistory) tbody.insertBefore(dragged, firstHistory);
    else tbody.appendChild(dragged);
  });
  tbody.addEventListener("drop", (e) => {
    if (!drag.id) return;
    e.preventDefault();
    drag.dropped = true;
  });
}

async function refreshJobs() {
  // Rebuilding the table under a drag in progress would tear the row out of
  // the user's hand mid-gesture. The 3s poll waits.
  if (drag.id) return;
  const jobs = await api("/jobs");
  const tbody = document.getElementById("jobRows");
  tbody.innerHTML = "";
  for (const j of jobs) {
    const tr = document.createElement("tr");
    tr.dataset.id = j.id;
    // A comparison is not in the conversion queue and cannot be reordered into
    // it - it runs on its own worker, alongside whatever is on the GPU.
    const queued = j.status === "queued" && j.mode !== "compare";
    tr.className = queued ? "queued-row"
                  : j.status === "running" ? "running-row" : "history-row";
    const created = new Date(j.created_at).toLocaleString();
    const pos = queued
      ? `<span class="grip">&#10303;</span><span class="${j.queue_index === 1 ? "next" : ""}">${j.queue_index}</span>`
      : j.status === "running" ? `<span class="next">&#9654;</span>` : "";
    tr.innerHTML = `
      <td class="pos" data-label="Queue">${pos}</td>
      <td data-label="Created">${esc(created)}</td>
      <td data-label="Mode">${esc(j.mode)}</td>
      <td data-label="Quality">${qualityCell(j)}</td>
      <td class="path" data-label="Input" title="${esc(j.output_path || j.input_path)}">${esc(j.output_path ? j.output_path.split("/").pop() : j.input_path)}</td>
      <td data-label="Format">${esc(j.stereo_format)}</td>
      <td data-label="Status"><span class="status status-${j.status}" title="${esc(j.error || "")}">${STATUS_WORD[j.status] || j.status}</span></td>
      <td data-label="Progress">${progressCell(j)}</td>
      <td class="eta" data-label="ETA">${etaCell(j)}</td>
      <td class="job-actions" data-label=""></td>
    `;
    if (queued) {
      tr.draggable = true;
      tr.addEventListener("dragstart", (e) => {
        drag.id = j.id;
        drag.dropped = false;
        tr.classList.add("dragging");
        e.dataTransfer.effectAllowed = "move";
        // Firefox will not start a drag at all without payload on the transfer.
        e.dataTransfer.setData("text/plain", j.id);
      });
      tr.addEventListener("dragend", async () => {
        tr.classList.remove("dragging");
        const dropped = drag.dropped;
        drag.id = null;
        drag.dropped = false;
        // Escape, or a drop outside the table: the rows have been moving under
        // the pointer all along, so put them back rather than saving a gesture
        // the user just took back.
        if (dropped) await commitOrder(); else await refreshJobs();
      });
    }
    const actions = tr.querySelector(".job-actions");
    if (queued) {
      // Dragging is fine over a screenful. A queue a hundred deep is why this
      // feature was asked for, and "run this next" should not require holding
      // the mouse down while the page scrolls. It is also the only way to
      // reorder on a phone, where HTML5 drag and drop does not exist.
      const move = document.createElement("span");
      move.className = "move";
      for (const [label, to, title] of [["⤒", "top", "Run next"],
                                         ["⤓", "bottom", "Run last"]]) {
        const b = document.createElement("button");
        b.textContent = label;
        b.title = title;
        b.onclick = () => moveJob(j.id, to);
        move.appendChild(b);
      }
      actions.appendChild(move);
    }
    const logBtn = document.createElement("button");
    logBtn.className = "secondary";
    logBtn.textContent = "Log";
    logBtn.onclick = () => showLog(j.id);
    actions.appendChild(logBtn);
    if (j.status === "queued" || j.status === "running") {
      const cancelBtn = document.createElement("button");
      cancelBtn.className = "danger";
      cancelBtn.textContent = "Cancel";
      cancelBtn.onclick = async () => { await api(`/jobs/${j.id}/cancel`, { method: "POST" }); refreshJobs(); };
      actions.appendChild(cancelBtn);
    } else {
      const delBtn = document.createElement("button");
      delBtn.className = "secondary";
      delBtn.textContent = "Remove";
      delBtn.onclick = async () => { await api(`/jobs/${j.id}`, { method: "DELETE" }); refreshJobs(); };
      actions.appendChild(delBtn);
    }
    tbody.appendChild(tr);
  }
  refreshQueueSummary();
  refreshComparable();
}

// Rendering every SSE message straight into the DOM (textContent +=) is what
// crashed the tab on a job with a huge backlog of buffered lines - a batch of
// replay messages could still fire faster than the browser can reflow.
// Buffer incoming text and flush at most a few times a second instead, and
// cap total retained length so an hours-long live-tailed job can't grow the
// DOM/string without bound.
const LOG_MAX_CHARS = 200000;
const LOG_FLUSH_MS = 200;
let logBuffer = "";
let logPending = "";
let logFlushTimer = null;

function scheduleLogFlush() {
  if (logFlushTimer) return;
  logFlushTimer = setTimeout(() => {
    logFlushTimer = null;
    if (!logPending) return;
    logBuffer += logPending;
    logPending = "";
    if (logBuffer.length > LOG_MAX_CHARS) {
      logBuffer = "[... earlier output truncated ...]\n" + logBuffer.slice(-LOG_MAX_CHARS);
    }
    const logEl = document.getElementById("log");
    logEl.textContent = logBuffer;
    logEl.scrollTop = logEl.scrollHeight;
  }, LOG_FLUSH_MS);
}

function showLog(jobId) {
  openLogJobId = jobId;
  const logEl = document.getElementById("log");
  logEl.style.display = "block";
  logEl.textContent = "";
  logBuffer = "";
  logPending = "";
  if (logFlushTimer) { clearTimeout(logFlushTimer); logFlushTimer = null; }
  if (logEventSource) logEventSource.close();
  logEventSource = new EventSource(`${API}/jobs/${jobId}/log`);
  logEventSource.onmessage = (e) => {
    logPending += JSON.parse(e.data);
    scheduleLogFlush();
  };
  logEventSource.addEventListener("eof", () => { logEventSource.close(); });
}

// --- Init ---------------------------------------------------------------
(async function init() {
  await loadHealth();
  schema = await api("/schema");
  quality = await api("/quality");
  renderSettingsForm();
  renderQuality();
  await loadBrowser("");
  initQueueDnd();
  await refreshJobs();
  setInterval(refreshJobs, 3000);
})();
</script>
</body>
